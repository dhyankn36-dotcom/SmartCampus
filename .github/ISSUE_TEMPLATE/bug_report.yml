name: Bug report
description: Report a reproducible issue in SmartCampus
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, JWTs, student personal data, database credentials, or private complaint details."
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Student frontend
        - Admin frontend
        - Authentication and authorization
        - Complaint submission
        - Status history
        - Feedback
        - Image upload
        - Backend API
        - Database
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Sign in with a test account...\n2. Open...\n3. Submit..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, browser, Python and Node versions"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: text
    validations:
      required: false
